name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea? We'd love to hear it!
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement
      placeholder: "NPCs should be able to trade items with each other..."
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      placeholder: "Right now items sit in NPC inventories without purpose..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - NPC Behavior
        - Player Interaction
        - World Generation
        - Frontend / UI
        - Economy / Items
        - Portraits / Visuals
        - Performance
        - Other
    validations:
      required: true

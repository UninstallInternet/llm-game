server {
    listen 80;

    root /app/dist;
    index index.html;

    keepalive_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Proxy ALL /api/* requests to Express server
    location /api/ {
        proxy_pass http://server:3001;

        # LLM world generation can take 60-90s; SSE needs long-lived connection
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # SSE (Server-Sent Events) — REQUIRED for /api/events
        proxy_http_version 1.1;
        proxy_set_header Connection '';        # keep-alive for SSE
        proxy_buffering off;                   # CRITICAL: disable for SSE streaming
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
